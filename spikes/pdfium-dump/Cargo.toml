[package]
name = "pdfium-dump"
version = "0.0.0"
edition = "2021"
publish = false

# Empty workspace table: keeps this throwaway crate independent from src-tauri.
[workspace]

[dependencies]
pdfium-render = "0.9.5"
# pdfium-render pulls `image` without encoders; enable PNG so we can save renders.
image = { version = "0.25", default-features = false, features = ["png"] }
