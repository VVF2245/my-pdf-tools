name: ci

# Tests and builds on Windows and macOS. It only uploads workflow artifacts;
# it does NOT create a release (releases come in Phase 4).
on:
  push:
    branches: [main, "feat/**", "spikes/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Rust tests
        run: cargo test --workspace

      # `cargo test` regenerates the TypeScript types: they must match what is committed.
      - name: Generated TypeScript types are up to date
        if: runner.os == 'macOS'
        run: git diff --exit-code -- src/shared/ipc/bindings

      - name: Type-check the frontend
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          # macOS: ad-hoc signature (no Apple Developer account). Ignored on Windows.
          APPLE_SIGNING_IDENTITY: "-"

      # macOS: zip with ditto (keeps permissions and symlinks, unlike generic zip tools).
      - name: Zip macOS app with ditto
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            target/release/bundle/macos/my-pdf-tools.app \
            my-pdf-tools-macos.zip

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: my-pdf-tools-windows
          path: |
            target/release/my-pdf-tools.exe
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: my-pdf-tools-macos
          path: my-pdf-tools-macos.zip
