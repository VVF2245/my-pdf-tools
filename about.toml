# cargo-about: the licenses of every Rust crate that ships in OutMark.
# A crate with a license that is not listed here makes the release build fail.
# Every license below is compatible with the AGPL-3.0.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

# Only what ends up in the program.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# OutMark's own crates are covered by its LICENSE file.
private = { ignore = true }

# Licenses are read from the crates themselves, not from an online service.
no-clearly-defined = true
