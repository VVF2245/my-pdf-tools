[workspace]
resolver = "3"
members = ["crates/core", "crates/engines", "crates/tools", "src-tauri"]

# Dependency rule (hexagonal): core <- engines <- tools <- src-tauri.
# `core` must never depend on any other crate of this workspace.

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
